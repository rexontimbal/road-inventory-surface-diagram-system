services:
  - type: web
    name: road-inventory-surface-diagram-system
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      cd backend && pip install -r requirements.txt &&
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
