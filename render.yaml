services:
  - type: web
    name: road-inventory-surface-diagram-system
    runtime: python
    plan: free
    region: singapore
    # Pinned explicitly. Render's Blueprint sync, when previewed from a
    # branch other than this service's actual deploy branch (e.g. this repo's
    # enhancements branch, where this file also lives), otherwise infers "no
    # branch specified" as "use the branch the Blueprint is being synced
    # from" -- which is exactly what proposed switching this live service to
    # enhancements. Explicit branch: main makes that impossible regardless of
    # which branch render.yaml is read from.
    branch: main
    buildCommand: >-
      cd backend && pip install -r requirements.txt &&
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

# The road-inventory-enhancements service is created and managed manually in
# the Render dashboard instead of through this Blueprint -- see the incident
# this avoided: syncing a Blueprint that defines a second service here, from
# the enhancements branch, offered to also repoint the service above (matched
# by name) onto that same branch. Keeping only one service in this file
# removes that risk entirely, not just for this file's current contents but
# for any future edit to it.
